server.port=8888
spring.datasource.url=jdbc:mysql://localhost:3306/an_choi_app?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=anchoiapp
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto= none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# App Properties
anchoi.app.jwtCookieName= anchoi
anchoi.app.jwtSecret= anchoiSecretKey
anchoi.app.jwtExpirationMs= 6000000

#config for file
#max file size for each request
spring.servlet.multipart.max-file-size=-1
#max request size for a multipart/form-data.
spring.servlet.multipart.max-request-size=-1
base.uri=/root/uploads
base.uri.separate=/